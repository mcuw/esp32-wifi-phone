name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Docker tag of the espressif/idf image used by esp-idf-ci-action.
  # If "v6.1" is not available on Docker Hub, try "release-v6.1".
  IDF_VERSION: v6.1
  IDF_TARGET: esp32c6

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: C unit tests (ADPCM, JSON, DNS) with ASan/UBSan
        run: sh test/host/run.sh
      - name: Web client test
        working-directory: web
        run: npm test

  web:
    name: Web UI (Astro + Qwik)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build
        working-directory: web
        run: npm run build
      # The page is compiled into the app (tools/pack_web.py, issue #16) and
      # takes room in each 3 MiB OTA slot - keep it small.
      - name: Check output size (embedded in the app)
        working-directory: web
        run: |
          test -f dist/index.html
          kib=$(du -sk dist | cut -f1)
          echo "dist size: ${kib} KiB"
          [ "$kib" -lt 512 ]
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  firmware:
    name: Firmware (ESP-IDF, ESP32-C6)
    needs: [host-tests, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0              # tags for git describe
      # The firmware version (esp_app_desc_t.version, compared by the OTA
      # update) comes from the tag: "v0.2.0", or "v0.2.0-3-gabc1234" between
      # releases. Written here because git inside the build container may
      # refuse the checkout (other owner).
      - name: Version from git tag
        run: |
          git describe --tags --always --dirty > version.txt
          echo "firmware version: $(cat version.txt)"
      # main/CMakeLists.txt embeds web/dist into the app
      - uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: web/dist
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ env.IDF_TARGET }}
          path: .
          command: idf.py build size
      - name: Collect flashable files
        run: |
          mkdir -p out
          cd build
          cp --parents bootloader/bootloader.bin partition_table/partition-table.bin ota_data_initial.bin \
             c6_phone.bin flash_args flasher_args.json ../out/
          cp c6_phone.elf ../out/
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ env.IDF_TARGET }}
          path: out
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: firmware-esp32c6
          path: fw
      # The phones fetch releases/latest/download/ota.json and then the app
      # image it names (main/ota.c). The image must carry the tag as version,
      # otherwise the phone rejects it after the download.
      - name: Check image version = tag
        run: |
          python3 - fw/c6_phone.bin "$GITHUB_REF_NAME" <<'PY'
          import sys
          d = open(sys.argv[1], "rb").read()
          i = d.find(bytes.fromhex("3254cdab"))           # esp_app_desc_t magic
          v = d[i + 16:i + 48].split(b"\0")[0].decode() if i >= 0 else None
          print("image version:", v)
          sys.exit(0 if v == sys.argv[2] else f"image version {v} != tag {sys.argv[2]}")
          PY
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd fw && rm -f c6_phone.elf && zip -qr ../esp32c6-phone-${GITHUB_REF_NAME}.zip .)
          cp fw/c6_phone.bin c6_phone.bin
          printf '{"version":"%s","url":"https://github.com/%s/releases/download/%s/c6_phone.bin"}\n' \
             "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > ota.json
          cat ota.json
          # "v1.2.0-rc1" -> pre-release: not "latest", so no phone is offered it
          pre=; case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes $pre \
             "esp32c6-phone-${GITHUB_REF_NAME}.zip" c6_phone.bin ota.json
