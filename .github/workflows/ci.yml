name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Docker tag of the espressif/idf image used by esp-idf-ci-action.
  # If "v6.1" is not available on Docker Hub, try "release-v6.1".
  IDF_VERSION: v6.1
  IDF_TARGET: esp32c6

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: C unit tests (ADPCM, JSON, DNS) with ASan/UBSan
        run: sh test/host/run.sh
      - name: Web client test
        working-directory: web
        run: npm test

  web:
    name: Web UI (Astro + Qwik)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build
        working-directory: web
        run: npm run build
      - name: Check output fits the ~1.9 MiB "www" partition
        working-directory: web
        run: |
          test -f dist/index.html
          kib=$(du -sk dist | cut -f1)
          echo "dist size: ${kib} KiB"
          [ "$kib" -lt 1800 ]
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  firmware:
    name: Firmware (ESP-IDF, ESP32-C6)
    needs: [host-tests, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # main/CMakeLists.txt flashes web/dist into the "www" partition
      - uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: web/dist
      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ env.IDF_TARGET }}
          path: .
          command: idf.py build size
      - name: Collect flashable files
        run: |
          mkdir -p out
          cd build
          cp --parents bootloader/bootloader.bin partition_table/partition-table.bin ota_data_initial.bin \
             c6_phone.bin www.bin flash_args flasher_args.json ../out/
          cp c6_phone.elf ../out/
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ env.IDF_TARGET }}
          path: out
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: firmware-esp32c6
          path: fw
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd fw && rm -f c6_phone.elf && zip -qr ../esp32c6-phone-${GITHUB_REF_NAME}.zip .)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
             "esp32c6-phone-${GITHUB_REF_NAME}.zip"
